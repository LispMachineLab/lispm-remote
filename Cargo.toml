[workspace]
resolver = "3"
members = ["crates/client", "crates/display", "crates/module", "crates/protocol", "crates/relay", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Ryan.K"]
repository = "https://github.com/LispMachineLab/lispm-remote"

[workspace.dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10", default-features = false }
chacha20 = { version = "0.9", default-features = false, features = ["zeroize"] }
proptest = "1"
sha2 = { version = "0.10", default-features = false }
# Rings Network, at a release tag; its crates come from one repository.
rings-core = { git = "https://github.com/RingsNetwork/rings", rev = "bbc16567b361fbcd55786fecb5faa58567a9c62d", default-features = false, features = ["default"] }
rings-node = { git = "https://github.com/RingsNetwork/rings", rev = "bbc16567b361fbcd55786fecb5faa58567a9c62d", default-features = false, features = ["node"] }
rings-rpc = { git = "https://github.com/RingsNetwork/rings", rev = "bbc16567b361fbcd55786fecb5faa58567a9c62d" }
# Without "std" and "use-getrandom": randomness reaches snow only through
# the seeded resolver, so a handshake is a function of its inputs.
snow = { version = "0.10", default-features = false, features = [
  "use-blake2",
  "use-chacha20poly1305",
  "use-curve25519",
] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "deny"
# deny, not forbid: the emacs crate's macros allow unsafe code in what they generate.
unsafe_code = "deny"

[workspace.lints.clippy]
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
# Rust's default stripping of release libraries leaves the string table of
# a macOS dylib unaligned, and macOS 26's dyld refuses to load it
# ("mis-aligned LINKEDIT string pool").
strip = false
