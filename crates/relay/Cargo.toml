[package]
name = "lispm-remote-relay"
description = "Emacs tty frames as LispM Remote display surfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true, features = ["std"] }
getrandom = "0.3"
lispm-remote-display = { path = "../display" }
rustix = { version = "1", features = ["event", "fs", "process", "pty", "termios"] }
thiserror.workspace = true
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
unicode-width = "0.2"
vte = "0.15"

[dev-dependencies]
proptest.workspace = true
