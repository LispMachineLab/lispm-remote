<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<title>LispM</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>
<header id="bar">
  <nav id="tabs" aria-label="Open windows"></nav>
  <button id="add" type="button" title="Open a window" aria-controls="windows">+</button>
  <span id="status" role="status"></span>
</header>
<section id="windows" hidden aria-label="LispM's windows">
  <ul id="window-list"></ul>
</section>
<main id="screen">
  <canvas id="canvas"></canvas>
  <textarea id="keys" aria-label="Keyboard" autocapitalize="off" autocomplete="off"
            autocorrect="off" spellcheck="false"></textarea>
</main>
</body>
</html>
