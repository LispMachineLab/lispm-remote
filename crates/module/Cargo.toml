# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "lispm-remote-module"
description = "A Rings Network node inside Emacs, for LispM Remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
emacs = { version = "0.23.0", features = ["emacs-28"] }
getrandom = "0.3"
hex = "0.4"
lispm-remote-protocol = { path = "../protocol" }
qrcode = { version = "0.14", default-features = false }
rings-core.workspace = true
rings-node.workspace = true
rings-rpc.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

