name: Module

# Building Rings Network takes minutes, so this runs only when the module,
# its Lisp or its dependencies change.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'Makefile'
      - 'crates/**'
      - 'lisp/**'
      - 'test/**'
      - '.github/workflows/module.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'Makefile'
      - 'crates/**'
      - 'lisp/**'
      - 'test/**'
      - '.github/workflows/module.yml'

permissions:
  contents: read

jobs:
  module:
    name: Module and Lisp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - name: Lint
        run: cargo clippy -p lispm-remote-module --all-targets -- -D warnings
      - name: Byte-compile
        run: make compile
      - name: Test
        run: make test
