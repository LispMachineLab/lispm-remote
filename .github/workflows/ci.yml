name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy -p lispm-remote-protocol -p lispm-remote-web --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test -p lispm-remote-protocol -p lispm-remote-web
      - name: WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p lispm-remote-protocol -p lispm-remote-web --target wasm32-unknown-unknown
          cargo clippy -p lispm-remote-web --target wasm32-unknown-unknown -- -D warnings
