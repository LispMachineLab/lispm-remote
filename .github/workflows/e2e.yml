name: Browser

# The page against LispM, in Chromium with a fake camera and a network
# that test/e2e/run.sh cuts.  Building Rings's browser node and the module
# takes minutes, so this runs only when what it tests changes.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'Makefile'
      - 'crates/**'
      - 'lisp/**'
      - 'web/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'Makefile'
      - 'crates/**'
      - 'lisp/**'
      - 'web/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Page and LispM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Rust for WebAssembly
        run: rustup target add wasm32-unknown-unknown
      # Rings's browser node is built from its release tag when installed.
      - id: rings
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: rings-node-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # A fresh checkout is newer than the restored packages; they are not stale.
      - if: steps.rings.outputs.cache-hit == 'true'
        run: touch web/node_modules/.package-lock.json
      - name: Module
        run: make module
      - name: Page
        run: make page
      - name: Page tests
        run: cd web && npm test
      - name: Playwright
        run: |
          cd test/e2e
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test
        run: sudo env "PATH=$PATH" E2E_ARTIFACTS="$PWD/e2e-artifacts" test/e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: e2e-artifacts
